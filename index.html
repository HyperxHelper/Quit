<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Quit — science-backed quit plans built for students, by students. Quit smoking, quit wasting time, quit whatever holds you back."
    />
    <meta name="theme-color" content="#0f766e" />
    <script>
      // Apply the saved/preferred theme before first paint to avoid a flash.
      ;(function () {
        try {
          var stored = localStorage.getItem("quit.theme")
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches
          if (dark) document.documentElement.classList.add("dark")
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Quit — Start your comeback</title>
    <script>
      // Restore the intended route after a GitHub Pages SPA 404 redirect.
      ;(function () {
        try {
          var target = sessionStorage.getItem("quit.redirect")
          if (target && !location.href.includes(target.split(/[?#]/)[0])) {
            history.replaceState(null, "", new URL(target).pathname + new URL(target).search + new URL(target).hash)
          }
          sessionStorage.removeItem("quit.redirect")
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
