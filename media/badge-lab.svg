<svg xmlns="http://www.w3.org/2000/svg" width="110" height="20" viewBox="0 0 110 20" role="img" aria-label="Quit Lab">
  <defs>
    <clipPath id="round-lab">
      <rect x="0" y="0" width="110" height="20" rx="3" />
    </clipPath>
    <linearGradient id="shade-lab" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="20">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="1" stop-color="#000000" stop-opacity="0.08" />
    </linearGradient>
  </defs>
  <g clip-path="url(#round-lab)">
    <rect x="0" y="0" width="34" height="20" fill="#CCFBF1" />
    <rect x="34" y="0" width="76" height="20" fill="#0F766E" />
    <!-- microscope icon -->
    <circle cx="14" cy="8" r="4" stroke="#0D9488" stroke-width="1.8" fill="none" />
    <line x1="14" y1="12" x2="14" y2="16" stroke="#0D9488" stroke-width="1.8" stroke-linecap="round" />
    <line x1="10" y1="16" x2="18" y2="16" stroke="#0D9488" stroke-width="1.8" stroke-linecap="round" />
    <line x1="14" y1="4" x2="14" y2="2" stroke="#0D9488" stroke-width="1.4" stroke-linecap="round" />
    <line x1="11" y1="2" x2="17" y2="2" stroke="#0D9488" stroke-width="1.4" stroke-linecap="round" />
    <text x="72" y="12.6" text-anchor="middle" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="8" font-weight="700" letter-spacing="0.2">Quit Lab</text>
    <rect x="0" y="0" width="110" height="20" fill="url(#shade-lab)" />
  </g>
</svg>
